name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "アプリ名"
        required: true
        default: "WebApp"
        type: string
      package_name:
        description: "パッケージ名 (例: com.example.app)"
        required: true
        default: "com.example.webviewapp"
        type: string
      target_url:
        description: "接続先URL"
        required: true
        default: "https://example.com"
        type: string
      fullscreen:
        description: "フルスクリーン起動の有無"
        required: true
        default: true
        type: boolean
      icon_base64:
        description: "アプリアイコン (Base64 PNG)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply App Configuration
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          TARGET_URL: ${{ inputs.target_url }}
          FULLSCREEN: ${{ inputs.fullscreen }}
          ICON_BASE64: ${{ inputs.icon_base64 }}
        run: python3 scripts/apply_config.py

      - name: Grant Execute Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          safe_name=$(printf '%s' "$APP_NAME" | tr -cd '[:alnum:]_.-' | sed 's/^$/WebApp/')
          safe_package=$(printf '%s' "$PACKAGE_NAME" | tr -cd '[:alnum:]._-')
          mv android/app/build/outputs/apk/debug/app-debug.apk "${safe_name}_${safe_package}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webview-apk
          path: "*.apk"
          if-no-files-found: error
          retention-days: 7
